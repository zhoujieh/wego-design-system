name: Branch Cleanup

# 每日定时清理遗留分支：
# - 已合并 PR 的分支存活超 24 小时自动删除（keep-branch 标签例外）
# - 无 PR 归属且 14 天无活动的分支只报告不删（可能在本地迭代中）

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 清理已合并 PR 的遗留分支
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          echo "=== 已合并 PR 的分支（超过 24 小时未删除）==="
          cutoff=$(date -u -d '24 hours ago' +%s)
          gh pr list --state merged --limit 100 --json number,headRefName,mergedAt,labels \
            --jq '.[] | select((.labels | map(.name) | index("keep-branch")) | not) | "\(.number) \(.headRefName) \(.mergedAt)"' \
          | while read -r number branch merged_at; do
            merged_ts=$(date -u -d "$merged_at" +%s 2>/dev/null) || continue
            if [ "$merged_ts" -lt "$cutoff" ]; then
              echo "删除已合并 PR #$number 的遗留分支: $branch"
              git push origin --delete "$branch" 2>/dev/null || echo "远端分支 $branch 已不存在，跳过"
            fi
          done

      - name: 报告无归属的陈旧分支
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          echo "=== 无开放 PR 归属且 14 天无活动的分支（仅报告，不删除）==="
          cutoff_date=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          protected="main gh-pages"
          for branch in $(git ls-remote --heads origin --format '%(refname:short)'); do
            case " $protected " in *" $branch "*) continue ;; esac
            if ! gh pr list --state open --head "$branch" --json number --jq 'length' | grep -qv '^0$'; then
              last_commit_date=$(git ls-remote origin "$branch" --format='%(committerdate:iso8601)' 2>/dev/null | head -1)
              if [ -n "$last_commit_date" ] && [ "$last_commit_date" \< "$cutoff_date" ]; then
                echo "陈旧分支（可能仍在本地迭代，请人工确认）: $branch，最后提交 $last_commit_date"
              fi
            fi
          done
