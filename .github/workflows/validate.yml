name: Validate Wego Design

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # 以下为硬门禁：均为仓库内新增的协作一致性检查，必须全部通过。
      - name: 认领冲突检查
        run: node scripts/validate-claims.mjs
      - name: 场景修改认领检查
        if: github.event_name == 'pull_request'
        run: >-
          node scripts/validate-claims.mjs
          --check-changed
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --branch "${{ github.head_ref }}"
      - name: 路由生成一致性
        run: node scripts/build-routes.mjs --check
      - name: 设计系统同步一致性
        run: node scripts/sync-wego-app-lib.mjs --check
      - name: 设计系统与业务工作流完整守门验证
        run: node scripts/validate-wego-design.mjs --scope=system --strict
