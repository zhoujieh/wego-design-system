name: Sync Open PRs from Main

# main 每次前进后，自动对开放 PR 执行 merge main：
# 无冲突自动推送同步；有冲突打 needs-sync 标签提醒 PR 负责人处理，不自动解决。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 同步所有开放 PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number --jq '.[].number' | while read -r number; do
            echo "=== 同步 PR #$number ==="
            if result=$(gh api \
                --method POST \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/pulls/${number}/update-branch" 2>&1); then
              echo "PR #$number 已完成同步检查: $result"
              gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --remove-label needs-sync >/dev/null 2>&1 || true
            elif echo "$result" | grep -Eqi 'merge[_ -]?conflict|merge conflict'; then
              echo "PR #$number 存在冲突，打 needs-sync 标签"
              gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --add-label needs-sync
            elif echo "$result" | grep -Eqi 'not behind|already up.to.date'; then
              echo "PR #$number 已是最新，无需同步"
              gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --remove-label needs-sync >/dev/null 2>&1 || true
            else
              echo "PR #$number 同步失败: $result" >&2
              exit 1
            fi
          done
