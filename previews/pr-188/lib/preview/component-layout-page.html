<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Layout Page - 页面总框架</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../scaffold.css">
<link rel="stylesheet" href="../components.css">
<style>
/* @component-css-start */

/* Layout Page 只做页面骨架：占满场景面板，纵向排列 top/body/bottom，
   自身 overflow:hidden 不产生滚动，主滚动权交给 layout-scroll。 */
.layout-page {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  min-height: 0;
  overflow: hidden;
  box-sizing: border-box;
}

.layout-page__top {
  flex: 0 0 auto;
}

.layout-page__body {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.layout-page__bottom {
  flex: 0 0 auto;
}

/* @component-css-end */

body { margin: 0; background: var(--bg-page); }
.lp-demo { height: 480px; display: flex; }
.lp-demo .layout-page { background: var(--bg-surface); }
.lp-demo__top { padding: var(--spacer-8); background: var(--bg-panel); color: var(--text-default); font-size: var(--heading-sm-font-size); }
.lp-demo__body { padding: var(--spacer-16); color: var(--text-secondary); }
.lp-demo__bottom { padding: var(--spacer-8); background: var(--bg-panel); color: var(--text-default); border-top: 1px solid var(--border-neutral-l2); }
</style>
</head>
<body>
<div class="lp-demo">
  <div class="layout-page" data-component-slug="layout-page">
    <div class="layout-page__top lp-demo__top">顶部区域</div>
    <div class="layout-page__body lp-demo__body">正文区域（自适应剩余高度，内部承载 layout-scroll）</div>
    <div class="layout-page__bottom lp-demo__bottom">底部区域</div>
  </div>
</div>
</body>
</html>
