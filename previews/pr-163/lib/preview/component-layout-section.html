<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Layout Section - 大型信息分区</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../scaffold.css">
<link rel="stylesheet" href="../components.css">
<style>
/* @component-css-start */

/* Layout Section 是主滚动区中的大型信息分区：管理横向边距与前后间距。
   edge 沿用现有 --layout-page-margin-* Token，gap 接收正式 --spacer-* Token。 */
.layout-section {
  --layout-section-edge: var(--layout-page-margin-m0);
  --layout-section-gap-before: var(--spacer-0);
  --layout-section-gap-after: var(--spacer-0);
  width: 100%;
  box-sizing: border-box;
  padding-inline: var(--layout-section-edge);
  margin-block-start: var(--layout-section-gap-before);
  margin-block-end: var(--layout-section-gap-after);
}

.layout-section[data-edge="M8"] { --layout-section-edge: var(--layout-page-margin-m8); }
.layout-section[data-edge="M32"] { --layout-section-edge: var(--layout-page-margin-m32); }

.layout-section[data-width="content"] { max-width: 100%; }

/* @component-css-end */

body { margin: 0; background: var(--bg-page); }
.lsec-demo { max-width: 393px; margin-inline: auto; }
.lsec-demo__scroll { height: 360px; overflow-y: auto; background: var(--bg-surface); }
.lsec-demo__section { padding: var(--spacer-12); color: var(--text-default); border-bottom: 1px solid var(--border-neutral-l2); }
.lsec-demo__hint { padding: var(--spacer-12); color: var(--text-secondary); }
</style>
</head>
<body>
<div class="lsec-demo">
  <div class="lsec-demo__scroll">
    <div class="layout-section" data-component-slug="layout-section" data-edge="M8" style="--layout-section-gap-before:var(--spacer-0);--layout-section-gap-after:var(--spacer-0)">
      <div class="lsec-demo__section">分区一（M8 边距）</div>
    </div>
    <div class="layout-section" data-component-slug="layout-section" data-edge="M0">
      <div class="lsec-demo__section">分区二（M0 通栏）</div>
    </div>
    <div class="layout-section" data-component-slug="layout-section" data-edge="M32">
      <div class="lsec-demo__section">分区三（M32 宽边距）</div>
    </div>
    <div class="lsec-demo__hint">不同 edge 下横向边距不同；前后间距通过局部变量接收正式 Spacer Token。</div>
  </div>
</div>
</body>
</html>
