<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Layout Flow - 线性排列</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../scaffold.css">
<link rel="stylesheet" href="../components.css">
<style>
/* @component-css-start */

/* Layout Flow 是同一区域中的线性排列：按 direction 决定主轴，
   gap 通过局部变量 --layout-flow-gap 接收正式 Spacer Token。 */
.layout-flow {
  --layout-flow-gap: var(--spacer-0);
  display: flex;
  min-width: 0;
  box-sizing: border-box;
}

.layout-flow[data-direction="vertical"] { flex-direction: column; gap: var(--layout-flow-gap); }
.layout-flow[data-direction="horizontal"] { flex-direction: row; gap: var(--layout-flow-gap); }

.layout-flow[data-align="start"] { align-items: flex-start; }
.layout-flow[data-align="center"] { align-items: center; }
.layout-flow[data-align="end"] { align-items: flex-end; }
.layout-flow[data-align="stretch"] { align-items: stretch; }

.layout-flow[data-justify="start"] { justify-content: flex-start; }
.layout-flow[data-justify="center"] { justify-content: center; }
.layout-flow[data-justify="end"] { justify-content: flex-end; }
.layout-flow[data-justify="between"] { justify-content: space-between; }

.layout-flow[data-wrap="wrap"] { flex-wrap: wrap; }

/* @component-css-end */

body { margin: 0; background: var(--bg-page); }
.lf-demo { max-width: 393px; margin-inline: auto; padding: var(--spacer-12); background: var(--bg-surface); }
.lf-demo__section + .lf-demo__section { margin-top: var(--spacer-12); }
.lf-demo__label { color: var(--text-secondary); margin-bottom: var(--spacer-8); }
.lf-demo__item { padding: var(--spacer-8); background: var(--bg-page); border: 1px solid var(--border-neutral-l2); border-radius: var(--radius-8); color: var(--text-default); }
</style>
</head>
<body>
<div class="lf-demo">
  <div class="lf-demo__section">
    <div class="lf-demo__label">纵向排列（gap=8）</div>
    <div class="layout-flow" data-component-slug="layout-flow" data-direction="vertical" data-align="stretch" style="--layout-flow-gap:var(--spacer-8)">
      <div class="lf-demo__item">项 A</div>
      <div class="lf-demo__item">项 B</div>
      <div class="lf-demo__item">项 C</div>
    </div>
  </div>
  <div class="lf-demo__section">
    <div class="lf-demo__label">横向两端分布（gap=8）</div>
    <div class="layout-flow" data-component-slug="layout-flow" data-direction="horizontal" data-align="center" data-justify="between" style="--layout-flow-gap:var(--spacer-8)">
      <div class="lf-demo__item">左</div>
      <div class="lf-demo__item">右</div>
    </div>
  </div>
</div>
</body>
</html>
