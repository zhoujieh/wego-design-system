<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading 加载 — 微购设计系统</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../scaffold.css">
<link rel="stylesheet" href="../iconfont.css">
<style>

/* @component-css-start */
/* ── Loading 加载指示器(Figma icon/加载 7207:13957,三点依次脉冲) ── */
.loading { --loading-size:var(--size-24); display:inline-flex; align-items:center; justify-content:center; width:var(--loading-size); height:var(--loading-size); }
.loading--16 { --loading-size:var(--size-16); }
.loading--32 { --loading-size:var(--size-32); }
.loading__icon { display:flex; align-items:center; justify-content:space-between; width:100%; height:100%; padding-inline:15%; box-sizing:border-box; }
.loading__dot { width:16.667%; aspect-ratio:1; border-radius:50%; background-color:#B7BEC5; transform-origin:center; animation:loading-dot 0.8s ease-in-out infinite; }
.loading__dot--1 { animation-delay:0s; }
.loading__dot--2 { animation-delay:0.27s; }
.loading__dot--3 { animation-delay:0.53s; }
@keyframes loading-dot { 0%,100% { opacity:0.2; transform:scale(0.6); } 33% { opacity:0.5; transform:scale(0.8); } 66% { opacity:1; transform:scale(1); } }
@media (prefers-reduced-motion: reduce) {
  .loading__dot { animation:loading-fade 1.4s ease-in-out infinite; }
  @keyframes loading-fade { 0%,100% { opacity:0.4; } 50% { opacity:1; } }
}
/* @component-css-end */

.loading-demo-center { display:flex; align-items:center; justify-content:center; width:100%; height:120px; background:var(--bg-subtle); border-radius:var(--radius-8); }
.loading-demo-note { font-size:var(--body-sm-font-size); color:var(--text-tertiary); max-width:400px; line-height:1.6; }
.loading-demo-row { display:flex; align-items:center; gap:var(--spacer-12); }
</style>
</head>
<body>
<div class="pv-header"><h1>加载</h1><p>三点依次脉冲加载指示器，用于内容区或弹窗等待态。</p></div>

<div class="pv-section__title">尺寸 24 — 默认</div>
<div class="loading-demo-center">
  <span class="loading" role="status" aria-label="加载中"><span class="loading__icon"><span class="loading__dot loading__dot--1"></span><span class="loading__dot loading__dot--2"></span><span class="loading__dot loading__dot--3"></span></span></span>
</div>

<div class="pv-section__title">尺寸 16 — 按钮内</div>
<div class="loading-demo-row">
  <span class="label">16px</span>
  <span class="loading loading--16" role="status" aria-label="加载中"><span class="loading__icon"><span class="loading__dot loading__dot--1"></span><span class="loading__dot loading__dot--2"></span><span class="loading__dot loading__dot--3"></span></span></span>
</div>

<div class="pv-section__title">尺寸 32 — 大区域</div>
<div class="loading-demo-center">
  <span class="loading loading--32" role="status" aria-label="加载中"><span class="loading__icon"><span class="loading__dot loading__dot--1"></span><span class="loading__dot loading__dot--2"></span><span class="loading__dot loading__dot--3"></span></span></span>
</div>

<div class="pv-section__title">交互提示</div>
<div class="loading-demo-note">
  默认 24px 三点依次脉冲加载图标(Figma icon/加载)，0.8s ease-in-out 无限循环，三点波浪式 opacity+scale 传递；纯 span+CSS 实现，支持 16/24/32 尺寸按比例缩放；prefers-reduced-motion 时降级为整体淡入淡出。不内置文案，需提示文案时由宿主以 result 或文本节点组合。
</div>

</body>
</html>
