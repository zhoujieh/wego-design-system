<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wegoux 组件预览总览</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../scaffold.css">
<link rel="stylesheet" href="../iconfont.css">
<style>
html,
body {
  height: 100vh;
  margin: 0;
  overflow: hidden;
  scrollbar-width: none;
}

html::-webkit-scrollbar,
body::-webkit-scrollbar {
  display: none;
}

body {
  display: flex;
  flex-direction: column;
  padding: 20px 16px 16px;
  box-sizing: border-box;
}

.pv-header {
  flex-shrink: 0;
  margin-bottom: 0;
  padding-bottom: 0;
  border-bottom: 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
}

.pv-header__main {
  flex: 1;
  min-width: 0;
}

.pv-header__back {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 12px;
  border: 1px solid var(--border-neutral-l2);
  border-radius: var(--radius-8);
  background: var(--bg-surface);
  color: var(--text-secondary);
  font-size: var(--body-sm-font-size);
  line-height: var(--body-sm-line-height);
  cursor: pointer;
  transition: border-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard);
}

.pv-header__back:hover {
  border-color: var(--text-brand);
  color: var(--text-brand);
}

.pv-header__intro {
  margin-top: 12px;
  padding: 16px;
  border: 1px solid var(--border-neutral-l2);
  border-radius: var(--radius-12);
  background: var(--bg-surface);
  color: var(--text-secondary);
  font-size: var(--body-md-font-size);
  line-height: var(--body-md-line-height);
}

.pv-header__intro strong {
  color: var(--text-default);
}

.overview-layout {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 272px minmax(0, 1fr);
  gap: 16px;
  margin-top: 16px;
}

.overview-sidebar,
.overview-viewer {
  min-width: 0;
  border: 1px solid var(--border-neutral-l2);
  border-radius: var(--radius-12);
  background: var(--bg-surface);
  box-shadow: var(--shadow-xs);
}

.overview-sidebar {
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow-y: auto;
  padding: 16px 0;
  scrollbar-width: none;
}

.overview-sidebar::-webkit-scrollbar {
  display: none;
}

.overview-sidebar__header {
  padding: 0 16px 16px;
}

.overview-sidebar__title {
  margin: 0;
  color: var(--text-default);
  font-size: var(--heading-sm-font-size);
  line-height: var(--heading-sm-line-height);
}

.overview-sidebar__sub {
  margin-top: 4px;
  color: var(--text-tertiary);
  font-size: var(--body-sm-font-size);
  line-height: var(--body-sm-line-height);
}

.overview-sidebar__search {
  margin-top: 12px;
}

.overview-sidebar__search-input {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border-neutral-l2);
  border-radius: var(--radius-8);
  background: var(--bg-surface);
  box-sizing: border-box;
  transition: border-color var(--duration-fast) var(--ease-standard);
}

.overview-sidebar__search-input:focus-within {
  border-color: var(--text-brand);
}

.overview-sidebar__search-input i {
  flex-shrink: 0;
  color: var(--text-tertiary);
  font-size: 16px;
  line-height: 1;
}

.overview-sidebar__search-input input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--text-default);
  font-size: var(--body-sm-font-size);
  line-height: var(--body-sm-line-height);
  font-family: inherit;
}

.overview-sidebar__search-input input::placeholder {
  color: var(--text-tertiary);
}

.overview-sidebar__empty {
  padding: 24px 16px;
  text-align: center;
  color: var(--text-tertiary);
  font-size: var(--body-sm-font-size);
  line-height: var(--body-sm-line-height);
}

.overview-nav-item__name mark,
.overview-nav-item__slug mark {
  background: var(--status-warning-surface-l1, #fff7e6);
  color: var(--status-warning-default, #d48806);
  padding: 0 1px;
  border-radius: 2px;
}

.overview-nav-item[hidden],
.overview-nav-group[hidden] {
  display: none !important;
}

.overview-search-results {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 0 8px;
}

.overview-nav-group + .overview-nav-group {
  margin-top: 16px;
}

.overview-nav-group__title {
  margin: 0 16px 8px;
  color: var(--text-tertiary);
  font-size: var(--body-xs-font-size);
  line-height: var(--body-xs-line-height);
}

.overview-nav-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.overview-nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: calc(100% - 16px);
  margin: 0 8px;
  padding: 12px;
  border: 0;
  border-radius: var(--radius-8);
  background: transparent;
  color: var(--text-default);
  text-align: left;
  cursor: pointer;
  transition: background var(--duration-fast) var(--ease-standard);
}

.overview-nav-item:hover {
  background: var(--bg-overlay-l1);
}

.overview-nav-item.is-active {
  background: var(--status-success-surface-l1);
}

.overview-nav-item__main {
  min-width: 0;
  flex: 1;
}

.overview-nav-item__name {
  display: block;
  color: var(--text-default);
  font-size: var(--body-md-font-size);
  line-height: var(--body-md-line-height);
}

.overview-nav-item__slug {
  display: block;
  margin-top: 2px;
  color: var(--text-tertiary);
  font-size: var(--body-xs-font-size);
  line-height: var(--body-xs-line-height);
}

.overview-nav-item__status {
  flex-shrink: 0;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--bg-overlay-l1);
  color: var(--text-secondary);
  font-size: var(--body-xs-font-size);
  line-height: var(--body-xs-line-height);
}

.overview-nav-item.is-active .overview-nav-item__status {
  background: var(--bg-surface);
  color: var(--status-success-default);
}

.overview-viewer {
  display: flex;
  flex-direction: column;
  min-height: 0;
  scrollbar-width: none;
}

.overview-viewer::-webkit-scrollbar {
  display: none;
}

.overview-viewer__frame-wrap {
  flex: 1;
  min-height: 0;
  padding: 16px;
  box-sizing: border-box;
}

.overview-viewer iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 1px solid var(--border-neutral-l2);
  border-radius: var(--radius-8);
  background: var(--bg-page);
  scrollbar-width: none;
}

.overview-viewer iframe::-webkit-scrollbar {
  display: none;
}

@media (max-width: 991px) {
  .overview-layout {
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-columns: 1fr;
  }

  .overview-sidebar {
    max-height: 240px;
    flex-shrink: 0;
  }

  .overview-nav-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 8px;
    padding: 0 8px;
  }

  .overview-nav-item {
    width: 100%;
    margin: 0;
  }
}

@media (max-width: 767px) {
  body {
    padding: 16px 12px 12px;
  }
}
</style>
</head>
<body>

<div class="pv-header">
  <div class="pv-header__main">
    <h1>组件预览总览</h1>
    <p>仅供人工验收查看的聚合入口。这里不复制组件内容，只关联现有单组件预览页，并在右侧按需切换显示。</p>
    <div class="pv-header__intro">
      <strong>维护规则：</strong> 每次新增已注册组件时，除了补 `components/{slug}.json`、`preview/component-{slug}.html`、注册表和聚合样式，也必须把新组件补到这个页面。
    </div>
  </div>
  <button type="button" class="pv-header__back" id="back-to-app" aria-label="返回 App 动态页">
    <i class="wego-iconfont-s icon-fanhui" aria-hidden="true"></i>
    <span>动态</span>
  </button>
</div>

    <section class="overview-nav-group">
      <h3 class="overview-nav-group__title">反馈类 Feedback</h3>
      <div class="overview-nav-list">
        <button class="overview-nav-item" type="button" data-name="提示" data-slug="toast" data-status="stable" data-src="./component-toast.html">
          <span class="overview-nav-item__main">
            <span class="overview-nav-item__name">提示</span>
            <span class="overview-nav-item__slug">toast</span>
          </span>
          <span class="overview-nav-item__status">stable</span>
        </button>
        <button class="overview-nav-item" type="button" data-name="对话框" data-slug="dialog" data-status="stable" data-src="./component-dialog.html">
          <span class="overview-nav-item__main">
            <span class="overview-nav-item__name">对话框</span>
            <span class="overview-nav-item__slug">dialog</span>
          </span>
          <span class="overview-nav-item__status">stable</span>
        </button>
        <button class="overview-nav-item" type="button" data-name="底部操作表单" data-slug="actionsheet" data-status="stable" data-src="./component-actionsheet.html">
          <span class="overview-nav-item__main">
            <span class="overview-nav-item__name">底部操作表单</span>
            <span class="overview-nav-item__slug">actionsheet</span>
          </span>

        </button>
        <button class="overview-nav-item" type="button" data-name="底部模态框" data-slug="modal" data-status="stable" data-src="./component-modal.html">
          <span class="overview-nav-item__main">
            <span class="overview-nav-item__name">底部模态框</span>
            <span class="overview-nav-item__slug">modal</span>
          </span>
          <span class="overview-nav-item__status">stable</span>
        </button>
        <button class="overview-nav-item" type="button" data-name="气泡菜单" data-slug="popmenu" data-status="stable" data-src="./component-popmenu.html">
          <span class="overview-nav-item__main">
            <span class="overview-nav-item__name">气泡菜单</span>
            <span class="overview-nav-item__slug">popmenu</span>
          </span>
          <span class="overview-nav-item__status">stable</span>
        </button>
        <button class="overview-nav-item" type="button" data-name="气泡提示" data-slug="popover" data-status="stable" data-src="./component-popover.html">
          <span class="overview-nav-item__main">
            <span class="overview-nav-item__name">气泡提示</span>
            <span class="overview-nav-item__slug">popover</span>
          </span>

        </button>
        <button class="overview-nav-item" type="button" data-name="骨架屏" data-slug="skeleton" data-status="stable" data-src="./component-skeleton.html">
          <span class="overview-nav-item__main">
            <span class="overview-nav-item__name">骨架屏</span>

          <span class="overview-nav-item__main">

        </button>

          <span class="overview-nav-item__main">
            <span class="overview-nav-item__name">结果</span>

      <iframe id="viewer-frame" src="./component-button.html" title="组件预览查看器"></iframe>
    </div>

<script>
const navItems = Array.from(document.querySelectorAll(".overview-nav-item"));
const navGroups = Array.from(document.querySelectorAll(".overview-nav-group"));
const viewerFrame = document.getElementById("viewer-frame");
const searchInput = document.getElementById("component-search");
const searchEmpty = document.getElementById("component-search-empty");
const searchResults = document.getElementById("search-results");
const sidebar = document.querySelector(".overview-sidebar");
const backToAppBtn = document.getElementById("back-to-app");

if (backToAppBtn) {
  backToAppBtn.addEventListener("click", function () {
    var targetHash = "#/album-product-feed";
    try {
      if (window.parent && window.parent !== window) {
        window.parent.location.hash = targetHash;
        return;
      }
    } catch (e) {
      // 跨域时降级为直接跳转
    }
    window.location.href = "../../../../wego-app/index.html" + targetHash;
  });
}

navItems.forEach(function (item) {
  var nameEl = item.querySelector(".overview-nav-item__name");
  var slugEl = item.querySelector(".overview-nav-item__slug");
  item._originalName = nameEl ? nameEl.textContent : "";
  item._originalSlug = slugEl ? slugEl.textContent : "";
});

sidebar.addEventListener("click", function (e) {
  var item = e.target.closest(".overview-nav-item");
  if (item && item.dataset.slug) {
    syncViewerBySlug(item.dataset.slug);
  }
});

function highlightText(text, term) {
  if (!term || !text) return text;
  var lower = text.toLowerCase();
  var idx = lower.indexOf(term);
  if (idx === -1) return text;
  var result = "";
  var lastIdx = 0;
  while (idx !== -1) {
    result += text.substring(lastIdx, idx);
    result += "<mark>" + text.substring(idx, idx + term.length) + "</mark>";
    lastIdx = idx + term.length;
    idx = lower.indexOf(term, lastIdx);
  }
  result += text.substring(lastIdx);
  return result;
}

function applyHighlight(item, terms) {
  var nameEl = item.querySelector(".overview-nav-item__name");
  var slugEl = item.querySelector(".overview-nav-item__slug");
  var name = item._originalName || "";
  var slug = item._originalSlug || "";
  terms.forEach(function (term) {
    if (hasChinese(term)) {
      name = highlightText(name, term);
    } else {
      slug = highlightText(slug, term);
    }
  });
  if (nameEl) nameEl.innerHTML = name;
  if (slugEl) slugEl.innerHTML = slug;
}

function clearHighlight(item) {
  var nameEl = item.querySelector(".overview-nav-item__name");
  var slugEl = item.querySelector(".overview-nav-item__slug");
  if (nameEl) nameEl.textContent = item._originalName || "";
  if (slugEl) slugEl.textContent = item._originalSlug || "";
}

function hasChinese(str) {
  return /[\u4e00-\u9fa5]/.test(str);
}

function matchSlugWord(slug, term) {
  var words = slug.split("-");
  for (var i = 0; i < words.length; i++) {
    if (words[i] === term || words[i].indexOf(term) === 0) return true;
  }
  return false;
}

function calcMatchScore(name, slug, terms) {
  var score = 0;
  terms.forEach(function (term) {
    if (hasChinese(term)) {
      if (name === term) score += 100;
      else if (name.indexOf(term) === 0) score += 80;
      else if (name.indexOf(term) !== -1) score += 60;
    } else {
      var words = slug.split("-");
      words.forEach(function (w) {
        if (w === term) score += 90;
        else if (w.indexOf(term) === 0) score += 70;
      });
    }
  });
  return score;
}

function filterComponents(query) {
  var raw = (query || "").trim().toLowerCase();
  var terms = raw ? raw.split(/\s+/).filter(Boolean) : [];

  searchResults.innerHTML = "";
  navItems.forEach(function (item) {
    clearHighlight(item);
    item.hidden = false;
  });
  navGroups.forEach(function (group) {
    group.hidden = false;
  });

  if (terms.length === 0) {
    searchResults.hidden = true;
    searchEmpty.hidden = true;
    return;
  }

  var matched = [];
  navItems.forEach(function (item) {
    var name = (item.dataset.name || "").toLowerCase();
    var slug = (item.dataset.slug || "").toLowerCase();
    var isMatch = terms.every(function (term) {
      if (hasChinese(term)) {
        return name.indexOf(term) !== -1;
      }
      return matchSlugWord(slug, term);
    });
    if (isMatch) {
      matched.push({ item: item, score: calcMatchScore(name, slug, terms) });
    }
  });

  matched.sort(function (a, b) {
    return b.score - a.score;
  });

  navGroups.forEach(function (group) {
    group.hidden = true;
  });

  searchResults.hidden = matched.length === 0;
  searchEmpty.hidden = matched.length > 0;

  matched.forEach(function (entry) {
    var clone = entry.item.cloneNode(true);
    clone._originalName = entry.item._originalName;
    clone._originalSlug = entry.item._originalSlug;
    applyHighlight(clone, terms);
    searchResults.appendChild(clone);
  });
}

if (searchInput) {
  searchInput.addEventListener("input", function () {
    filterComponents(searchInput.value);
  });
}

function syncViewerBySlug(slug) {
  const currentItem = navItems.find((item) => item.dataset.slug === slug) || navItems[0];
  if (!currentItem) return;

  navItems.forEach((item) => {
    item.classList.toggle("is-active", item === currentItem);
  });

  const { src } = currentItem.dataset;
  viewerFrame.src = src;

  const nextHash = `#${currentItem.dataset.slug}`;
  if (window.location.hash !== nextHash) {
    history.replaceState(null, "", nextHash);
  }
}

window.addEventListener("hashchange", () => {
  syncViewerBySlug(window.location.hash.replace("#", ""));
});

syncViewerBySlug(window.location.hash.replace("#", ""));

viewerFrame.addEventListener("load", () => {
  try {
    const doc = viewerFrame.contentDocument;
    if (doc && doc.documentElement) {
      doc.documentElement.style.scrollbarWidth = "none";
    }
    if (doc && doc.body) {
      doc.body.style.scrollbarWidth = "none";
    }
  } catch (e) {}
});
</script>

</body>
