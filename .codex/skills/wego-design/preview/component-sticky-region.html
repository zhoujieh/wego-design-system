<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sticky Region - 动态吸顶区域</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../scaffold.css">
<link rel="stylesheet" href="../components.css">
<style>
/* @component-css-start */

/* Sticky Region 只承担通栏吸附 surface、状态动效与内部留白。
   滚动方向、阈值、动态测量和 scroll-padding 由宿主滚动运行时负责。 */
.sticky-region {
  --sticky-region-expanded-size: 0px;
  --sticky-region-compact-size: 0px;
  --sticky-region-offset: 0px;
  --sticky-region-after-gap: var(--spacer-0);
  --sticky-region-inline-inset: var(--layout-page-margin-m0);
  --sticky-region-duration: var(--duration-normal);
  position: sticky;
  top: var(--sticky-region-offset);
  z-index: var(--z-sticky);
  display: block;
  flex-shrink: 0;
  width: 100%;
  max-height: var(--sticky-region-expanded-size);
  margin-block-end: var(--sticky-region-after-gap);
  overflow: hidden;
  isolation: isolate;
  box-sizing: border-box;
  background: var(--bg-surface);
  transition: max-height var(--sticky-region-duration) var(--ease-emphasized);
}

.sticky-region[data-edge="bottom"] {
  top: auto;
  bottom: var(--sticky-region-offset);
}

.sticky-region__motion {
  width: 100%;
  transform: translateY(0);
  transition: transform var(--sticky-region-duration) var(--ease-emphasized);
}

.sticky-region__inner {
  width: 100%;
  padding-inline: var(--sticky-region-inline-inset);
  box-sizing: border-box;
}

.sticky-region[data-state="hidden"] {
  max-height: 0;
  pointer-events: none;
}

.sticky-region[data-edge="top"][data-state="hidden"] .sticky-region__motion {
  transform: translateY(-100%);
}

.sticky-region[data-edge="bottom"][data-state="hidden"] .sticky-region__motion {
  transform: translateY(100%);
}

.sticky-region[data-state="compact"] {
  max-height: var(--sticky-region-compact-size);
}

.sticky-region[data-visibility="always"] {
  transition: none;
}

.sticky-region[data-visibility="direction-reveal"],
.sticky-region[data-visibility="compact-on-scroll"],
.sticky-region[data-visibility="pin-after-threshold"],
.sticky-region[data-visibility="elevate-after-scroll"],
.sticky-region[data-state="visible"],
.sticky-region[data-state="pinned"] {
  box-sizing: border-box;
}

.sticky-region[data-elevated="true"] {
  border-bottom: 1px solid var(--border-neutral-l2);
}

/* @component-css-end */

body { margin: 0; background: #f5f5f5; }
.sticky-demo { height: 360px; overflow-y: auto; background: #f5f5f5; position: relative; }
.sticky-demo__bar { min-height: 52px; display: flex; align-items: center; padding: 0 12px; }
.sticky-demo__content { height: 720px; padding: 16px; color: var(--text-secondary); }
.sticky-demo__hint { padding: 12px 16px; background: var(--bg-overlay-l1); font-size: 12px; color: var(--text-secondary); }
</style>
</head>
<body>
<div class="sticky-demo" data-demo-scroll>
  <!-- 栈式叠加：elevate-after-scroll + direction-reveal（复现多 sticky-region 场景） -->
  <div class="sticky-region" data-edge="top" data-visibility="elevate-after-scroll" data-state="visible" style="--sticky-region-expanded-size:44px;--sticky-region-inline-inset:8px;--sticky-region-after-gap:0">
    <div class="sticky-region__motion">
      <div class="sticky-region__inner">
        <div class="sticky-demo__bar" style="min-height:44px;font-size:14px;font-weight:600;">分类标签 · elevate</div>
      </div>
    </div>
  </div>
  <div class="sticky-region" data-edge="top" data-visibility="direction-reveal" data-state="visible" style="--sticky-region-expanded-size:52px;--sticky-region-inline-inset:8px;--sticky-region-after-gap:12px">
    <div class="sticky-region__motion">
      <div class="sticky-region__inner">
        <div class="sticky-demo__bar">搜索框 · direction-reveal</div>
      </div>
    </div>
  </div>
  <div class="sticky-demo__content">
    <p>向下滚动：direction-reveal 区域累计同方向滚动超过阈值后隐藏。</p>
    <p>向上滚动：累计反向滚动超过阈值后恢复显示。</p>
    <p style="margin-top:24px;color:var(--text-tertiary);">慢速滚动不抖动（验证 layoutTransitioning 期间不切换状态）。</p>
  </div>
</div>
<div class="sticky-demo__hint">提示：在上方区域内慢速上下滚动，观察搜索框是否稳定隐藏/显示。</div>
<script src="../../../../wego-app/js/scroll-layout.js"></script>
<script>
// 演示用：绑定 WegoScrollLayout，让 direction-reveal 和 elevate-after-scroll 真实运行
(function () {
  var scrollRoot = document.querySelector('[data-demo-scroll]');
  if (!scrollRoot || !window.WegoScrollLayout) return;
  var regions = Array.prototype.map.call(
    scrollRoot.querySelectorAll('.sticky-region'),
    function (el, i) {
      return {
        element: el,
        policy: el.dataset.visibility,
        edge: el.dataset.edge || 'top',
        essential: el.dataset.visibility === 'elevate-after-scroll',
        threshold: 8
      };
    }
  );
  window.WegoScrollLayout.bind({ root: scrollRoot, scrollRoot: scrollRoot, regions: regions });
})();
</script>
</body>
</html>
